version: "3.1"

intents:
  - saluer           # Keep if you need French support
  - lister_cours     # Keep if you need French support
  - greet            # English version
  - goodbye
  - list_courses     # English version
  - detail_cours
  - quiz_cours
  - out_of_scope

entities:
  - course_title

slots:
  course_title:
    type: text
    influence_conversation: true
    mappings:
      - type: from_entity
        entity: course_title

responses:
  utter_greet:
    - text: "👋 Hello! Welcome to the Learning Management System. How can I help you today?"

  utter_goodbye:
    - text: "👋 Goodbye! Happy learning!"

  utter_default:
    - text: "Sorry, I didn't understand that. Could you rephrase?"
    - text: "I'm not sure I follow. Can you ask in a different way?"

actions:
  - action_get_details
  - action_greet
  - action_get_quiz_info
  - action_get_courses  # Add this missing action

session_config:
  session_expiration_time: 60
  carry_over_slots_to_new_session: true