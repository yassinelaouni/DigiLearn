version: "3.1"

rules:
- rule: Course Details
  steps:
  - intent: detail_cours
  - action: action_get_details

- rule: Greeting
  steps:
  - intent: greet  # Or use 'saluer' if you prefer French
  - action: action_greet

- rule: List Courses
  steps:
  - intent: list_courses  # Or use 'lister_cours' if you prefer French
  - action: action_get_courses

- rule: Quiz Information
  steps:
  - intent: quiz_cours
  - action: action_get_quiz_info

- rule: Fallback
  steps:
  - intent: out_of_scope
  - action: utter_default